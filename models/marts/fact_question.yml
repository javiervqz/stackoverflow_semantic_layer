version: 2

models:
  - name: fact_question
    description: "Fact table containing measurable, additive and non-additive metrics for each Stack Overflow question."
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_question')
    columns:
      - name: question_id
        description: "Foreign key linking to dim_question."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_question')
                field: question_id
      - name: creation_date
        description: "Timestamp when the question was asked."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2008-01-01'"
      - name: accepted_answer_id
        description: "Foreign key linking to the accepted answer post."
      - name: score
        description: "Net vote score of the question."
        tests:
          - not_null
      - name: view_count
        description: "Number of views the question has received."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: answer_count
        description: "Number of answers submitted for the question."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: comment_count
        description: "Number of comments left on the question."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: favorite_count
        description: "Number of times the question was favorited."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0



semantic_models:
  - name: fact_question
    description: "Semantic model for Stack Overflow question facts and engagement measures."
    model: ref('fact_question')
    defaults:
      agg_time_dimension: creation_date
    entities:
      - name: question
        type: primary
        expr: question_id
    dimensions:
      - name: creation_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: total_questions
        description: "Total number of unique Stack Overflow questions asked."
        agg: count_distinct
        expr: question_id

      - name: total_answers
        description: "Total number of answers posted across all questions."
        agg: sum
        expr: answer_count

      - name: questions_with_accepted_answer
        description: "Count of questions that have an accepted (approved) answer."
        agg: sum
        expr: case when accepted_answer_id is not null then 1 else 0 end

      - name: questions_with_answers
        description: "Count of questions that have received at least one answer."
        agg: sum
        expr: case when answer_count > 0 then 1 else 0 end

      - name: total_views
        description: "Total number of views accumulated across questions."
        agg: sum
        expr: view_count

      - name: total_comments
        description: "Total number of comments left on questions."
        agg: sum
        expr: comment_count

      - name: total_score
        description: "Sum of net vote scores across questions."
        agg: sum
        expr: score

      - name: total_favorites
        description: "Total number of favorites received across questions."
        agg: sum
        expr: favorite_count
