version: 2

models:
  - name: dim_tags
    description: "Dimension table containing tag metadata."
    columns:
      - name: tag_id
        description: "Primary key. Unique identifier of the tag."
        tests:
          - unique
          - not_null
      - name: tag_name
        description: "The text name of the tag."
        tests:
          - not_null
      - name: tag_volume
        description: "Total lifetime volume of questions using this tag."

semantic_models:
  - name: dim_tags
    description: "Tag dimension containing tag metadata and volume."
    model: ref('dim_tags')
    entities:
      - name: tag
        type: primary
        expr: tag_id
    dimensions:
      - name: tag_name
        type: categorical
      - name: tag_volume
        type: categorical
