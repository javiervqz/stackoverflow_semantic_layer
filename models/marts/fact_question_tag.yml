version: 2

models:
  - name: fact_question_tag
    description: "Factless fact / bridge table linking each question to its individual tags."
    semantic_model:
      enabled: true
    agg_time_dimension: creation_date
    columns:
      - name: question_tag_id
        description: "Primary key. Surrogate key generated from question_id and tag_name."
        entity:
          name: question_tag
          type: primary
        tests:
          - unique
          - not_null
      - name: question_id
        description: "Foreign key linking to dim_question."
        entity:
          name: question
          type: foreign
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_question')
                field: question_id
      - name: tag_id
        description: "Foreign key linking to dim_tags (if tag exists in tags metadata)."
        entity:
          name: tag
          type: foreign
      - name: tag_name
        description: "The name of the individual tag associated with the question."
        dimension:
          type: categorical
        tests:
          - not_null
      - name: tag_lifetime_questions
        description: "Total lifetime count of questions with this tag from tag metadata."
        dimension:
          type: categorical
      - name: creation_date
        description: "Timestamp when the question was asked."
        granularity: day
        dimension:
          type: time
        tests:
          - not_null
      - name: tag_count
        description: "Number of tags associated with the question."
        dimension:
          type: categorical
    metrics:
      - name: tag_questions
        description: "Total questions associated with a specific tag."
        label: "Tag Questions"
        type: simple
        agg: count_distinct
        expr: question_id

      - name: tag_answers
        description: "Total answers received on questions with this tag."
        label: "Tag Answers"
        type: simple
        agg: sum
        expr: answer_count

      - name: tag_accepted_answers
        description: "Total accepted answers on questions with this tag."
        label: "Tag Accepted Answers"
        type: simple
        agg: sum
        expr: case when accepted_answer_id is not null then 1 else 0 end
