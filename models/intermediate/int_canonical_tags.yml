version: 2

models:
  - name: int_canonical_tags
    description: "Intermediate model that extracts distinct raw tag combinations from question posts, sorts the constituent tags alphabetically to create deterministic canonical tag groups, and assigns surrogate keys."
    columns:
      - name: raw_tags
        description: "Primary key. Distinct raw pipe-delimited string of tags from staging."
        tests:
          - unique
          - not_null
      - name: tags_group
        description: "Canonical pipe-delimited string of tags sorted alphabetically."
        tests:
          - not_null
      - name: tag_combination
        description: "Alias for tags_group representing the canonical tag combination."
      - name: tags_group_id
        description: "Surrogate key for the canonical set of tags."
        tests:
          - not_null
      - name: creation_date
        description: "Timestamp of the latest question created with this tag combination."
      - name: last_edit_date
        description: "Timestamp of the latest edit to a question with this tag combination."
