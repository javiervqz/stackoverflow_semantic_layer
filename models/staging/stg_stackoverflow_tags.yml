version: 2

models:
  - name: stg_stackoverflow_tags
    description: "Staged Stack Overflow tag data. Relabeled columns and selected key attributes."
    columns:
      - name: tag_id
        description: "Primary key. Unique identifier of the tag."
        tests:
          - unique
          - not_null
      - name: tag_name
        description: "The text name of the tag (e.g., 'python', 'javascript', 'dbt')."
      - name: questions_count
        description: "The total number of questions that use this tag."
      - name: excerpt_post_id
        description: "Foreign key. The ID of the post containing the excerpt (short description) for the tag."
      - name: wiki_post_id
        description: "Foreign key. The ID of the post containing the wiki (full description) for the tag."
