version: 2

semantic_models:
  - name: dim_question
    description: "Conformed dimension semantic model for Stack Overflow question posts."
    model: ref('dim_question')
    entities:
      - name: question
        type: primary
        expr: question_id
      - name: user
        type: foreign
        expr: owner_user_id
    dimensions:
      - name: last_activity_date
        type: time
        type_params:
          time_granularity: day
      - name: last_edit_date
        type: time
        type_params:
          time_granularity: day
      - name: title
        type: categorical
      - name: body_length
        type: categorical
      - name: title_length
        type: categorical
      - name: has_been_edited
        type: categorical
      - name: tag_count
        type: categorical
      - name: tags_group
        type: categorical
      - name: tag_combination
        type: categorical
      - name: tag_combination_volume
        type: categorical
      - name: has_accepted_answer
        type: categorical

  - name: fact_question
    description: "Semantic model for Stack Overflow question facts and engagement measures."
    model: ref('fact_question')
    defaults:
      agg_time_dimension: creation_date
    entities:
      - name: question
        type: primary
        expr: question_id
    dimensions:
      - name: creation_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: question_count
        description: "Total count of question posts."
        agg: count_distinct
        expr: question_id
      - name: score_sum
        description: "Sum of question net vote scores."
        agg: sum
        expr: score
      - name: view_count_sum
        description: "Sum of question views."
        agg: sum
        expr: view_count
      - name: answer_count_sum
        description: "Total answers received across questions."
        agg: sum
        expr: answer_count
      - name: comment_count_sum
        description: "Total comments received across questions."
        agg: sum
        expr: comment_count
      - name: favorite_count_sum
        description: "Total favorites received across questions."
        agg: sum
        expr: favorite_count
      - name: answered_question_count
        description: "Count of questions with at least one answer."
        agg: sum
        expr: case when answer_count > 0 then 1 else 0 end
      - name: accepted_question_count
        description: "Count of questions that have an accepted answer."
        agg: sum
        expr: case when accepted_answer_id is not null then 1 else 0 end

  - name: fact_question_tag
    description: "Bridge semantic model linking questions to individual tags with tag-level measures."
    model: ref('fact_question_tag')
    defaults:
      agg_time_dimension: creation_date
    entities:
      - name: question_tag
        type: primary
        expr: question_tag_id
      - name: question
        type: foreign
        expr: question_id
      - name: tag
        type: foreign
        expr: tag_id
    dimensions:
      - name: tag_name
        type: categorical
      - name: creation_date
        type: time
        type_params:
          time_granularity: day
      - name: tag_count
        type: categorical
      - name: tag_lifetime_questions
        type: categorical
    measures:
      - name: tag_question_count
        description: "Count of questions associated with this tag."
        agg: count_distinct
        expr: question_id
      - name: tag_answer_count_sum
        description: "Total answers on questions tagged with this tag."
        agg: sum
        expr: answer_count
      - name: tag_accepted_count_sum
        description: "Total accepted answers on questions tagged with this tag."
        agg: sum
        expr: case when accepted_answer_id is not null then 1 else 0 end
