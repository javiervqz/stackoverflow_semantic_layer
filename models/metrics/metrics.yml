version: 2

metrics:
  # =========================================================================
  # Core Question Metrics (Question Grain)
  # =========================================================================
  - name: total_questions
    description: "Total number of unique Stack Overflow questions asked."
    label: "Total Questions"
    type: simple
    type_params:
      measure: question_count

  - name: total_answers
    description: "Total number of answers posted across all questions."
    label: "Total Answers"
    type: simple
    type_params:
      measure: answer_count_sum

  - name: questions_with_accepted_answer
    description: "Count of questions that have an accepted (approved) answer."
    label: "Questions with Accepted Answer"
    type: simple
    type_params:
      measure: accepted_question_count

  - name: questions_with_answers
    description: "Count of questions that have received at least one answer."
    label: "Questions with Answers"
    type: simple
    type_params:
      measure: answered_question_count

  # =========================================================================
  # Ratio Metrics (Benchmark for Q1, Q2, Q3)
  # =========================================================================
  - name: acceptance_rate
    description: "Rate of questions with an accepted answer over total questions asked (Q1, Q2_b, Q2_c, Q3)."
    label: "Answer Acceptance Rate"
    type: ratio
    type_params:
      numerator: questions_with_accepted_answer
      denominator: total_questions

  - name: question_to_answer_ratio
    description: "Ratio of total answers per question asked (Q2_a, Q2_c)."
    label: "Question-to-Answer Ratio"
    type: ratio
    type_params:
      numerator: total_answers
      denominator: total_questions

  - name: avg_answers_per_question
    description: "Average number of answers received per question (Q3_a, Q3_b, Q3_c)."
    label: "Average Answers per Question"
    type: ratio
    type_params:
      numerator: total_answers
      denominator: total_questions

  - name: answer_rate
    description: "Proportion of questions that received at least one answer (Q3_a, Q3_b, Q3_c)."
    label: "Answer Rate"
    type: ratio
    type_params:
      numerator: questions_with_answers
      denominator: total_questions

  # =========================================================================
  # Engagement & Quality Metrics (Benchmark for Q3)
  # =========================================================================
  - name: total_views
    description: "Total number of views accumulated across questions."
    label: "Total Views"
    type: simple
    type_params:
      measure: view_count_sum

  - name: avg_views_per_question
    description: "Average views per question asked."
    label: "Average Views per Question"
    type: ratio
    type_params:
      numerator: total_views
      denominator: total_questions

  - name: total_comments
    description: "Total number of comments left on questions."
    label: "Total Comments"
    type: simple
    type_params:
      measure: comment_count_sum

  - name: avg_comments_per_question
    description: "Average comments per question asked."
    label: "Average Comments per Question"
    type: ratio
    type_params:
      numerator: total_comments
      denominator: total_questions

  - name: total_score
    description: "Sum of net vote scores across questions."
    label: "Total Score"
    type: simple
    type_params:
      measure: score_sum

  - name: avg_score_per_question
    description: "Average net score per question asked."
    label: "Average Score per Question"
    type: ratio
    type_params:
      numerator: total_score
      denominator: total_questions

  - name: total_favorites
    description: "Total number of favorites received across questions."
    label: "Total Favorites"
    type: simple
    type_params:
      measure: favorite_count_sum

  # =========================================================================
  # Tag Grain Metrics (Benchmark for Q1 & Q2 Tag Slicing)
  # =========================================================================
  - name: tag_questions
    description: "Total questions associated with a specific tag."
    label: "Tag Questions"
    type: simple
    type_params:
      measure: tag_question_count

  - name: tag_answers
    description: "Total answers received on questions with this tag."
    label: "Tag Answers"
    type: simple
    type_params:
      measure: tag_answer_count_sum

  - name: tag_accepted_answers
    description: "Total accepted answers on questions with this tag."
    label: "Tag Accepted Answers"
    type: simple
    type_params:
      measure: tag_accepted_count_sum

  - name: tag_acceptance_rate
    description: "Acceptance rate for questions with a specific tag (Q1 benchmark)."
    label: "Tag Acceptance Rate"
    type: ratio
    type_params:
      numerator: tag_accepted_answers
      denominator: tag_questions

  - name: tag_question_to_answer_ratio
    description: "Answers per question for questions with a specific tag (Q2 benchmark)."
    label: "Tag Question-to-Answer Ratio"
    type: ratio
    type_params:
      numerator: tag_answers
      denominator: tag_questions
