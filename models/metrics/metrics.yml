version: 2

metrics:
  # =========================================================================
  # Ratio Metrics (Benchmark for Q1, Q2, Q3)
  # =========================================================================
  - name: acceptance_rate
    description: "Rate of questions with an accepted answer over total questions asked (Q1, Q2_b, Q2_c, Q3)."
    label: "Answer Acceptance Rate"
    type: ratio
    numerator: questions_with_accepted_answer
    denominator: total_questions

  - name: question_to_answer_ratio
    description: "Ratio of total answers per question asked (Q2_a, Q2_c)."
    label: "Question-to-Answer Ratio"
    type: ratio
    numerator: total_answers
    denominator: total_questions

  - name: avg_answers_per_question
    description: "Average number of answers received per question (Q3_a, Q3_b, Q3_c)."
    label: "Average Answers per Question"
    type: ratio
    numerator: total_answers
    denominator: total_questions

  - name: answer_rate
    description: "Proportion of questions that received at least one answer (Q3_a, Q3_b, Q3_c)."
    label: "Answer Rate"
    type: ratio
    numerator: questions_with_answers
    denominator: total_questions

  # =========================================================================
  # Engagement & Quality Metrics (Benchmark for Q3)
  # =========================================================================
  - name: avg_views_per_question
    description: "Average views per question asked."
    label: "Average Views per Question"
    type: ratio
    numerator: total_views
    denominator: total_questions

  - name: avg_comments_per_question
    description: "Average comments per question asked."
    label: "Average Comments per Question"
    type: ratio
    numerator: total_comments
    denominator: total_questions

  - name: avg_score_per_question
    description: "Average net score per question asked."
    label: "Average Score per Question"
    type: ratio
    numerator: total_score
    denominator: total_questions

  # =========================================================================
  # Tag Grain Metrics (Benchmark for Q1 & Q2 Tag Slicing)
  # =========================================================================
  - name: tag_acceptance_rate
    description: "Acceptance rate for questions with a specific tag (Q1 benchmark)."
    label: "Tag Acceptance Rate"
    type: ratio
    numerator: tag_accepted_answers
    denominator: tag_questions

  - name: tag_question_to_answer_ratio
    description: "Answers per question for questions with a specific tag (Q2 benchmark)."
    label: "Tag Question-to-Answer Ratio"
    type: ratio
    numerator: tag_answers
    denominator: tag_questions
