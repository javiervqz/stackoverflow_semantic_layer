# For more information on configuring profiles.yml, see:
# https://docs.getdbt.com/docs/core/connect-data-platform/bigquery-setup

stackoverflow_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: gen-lang-client-0933260470
      # Target dataset (schema) in BigQuery where dbt will write tables and views.
      # You can change this to a user-specific dataset if multiple developers share the project.
      dataset: dbt_stackoverflow
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive
      retries: 1
