name: 'stackoverflow_dbt'
version: '1.0.0'
config-version: 2

# This setting points dbt to the profile defined in profiles.yml
profile: 'stackoverflow_dbt'

# Directory configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Files to remove on `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  stackoverflow_dbt:
    staging:
      +materialized: view
      +schema: staging
    
    marts:
      +materialized: table
      +schema: marts

vars:
  incremental_lookback_days: -3
